# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Enable OLED Display and Custom Status Screen (nice!oled)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# 32x128 Canvas for vertical OLED on Corne
CONFIG_NICE_OLED_CUSTOM_CANVAS_WIDTH=32
CONFIG_NICE_OLED_CUSTOM_CANVAS_HEIGHT=128

# Display idle settings
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# Central (Left) Screen Widgets
CONFIG_NICE_OLED_WIDGET_STATUS=y

# Peripheral (Right) Screen Widget: Animated Cat
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=y

# Disable ZMK Studio locking so it connects without requiring unlock keys
CONFIG_ZMK_STUDIO_LOCKING=n

