# Enable OLED Display and Custom Status Screen (nice!oled)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# 32x128 Canvas for vertical OLED on Corne
CONFIG_NICE_OLED_CUSTOM_CANVAS_WIDTH=32
CONFIG_NICE_OLED_CUSTOM_CANVAS_HEIGHT=128

# Display idle settings (blank screen after timeout to save battery)
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# --- Central (Left) Screen Configuration ---
CONFIG_NICE_OLED_WIDGET_STATUS=y

# Disable all WPM, Luna dog, and Bongo Cat animations
CONFIG_NICE_OLED_WIDGET_WPM=n
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_RESPONSIVE_BONGO_CAT=n

# Vertical Coordinate Corrections for 32x128 Canvas
# Range y 0-15: Battery level & charging icon
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_Y=0

# Range y 18-35: Selected output (USB / BLE) + active profile number
CONFIG_NICE_OLED_WIDGET_OUTPUT_USB_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_OUTPUT_USB_CUSTOM_Y=18
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_CUSTOM_Y=18
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_UNBONDED_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_UNBONDED_CUSTOM_Y=18
CONFIG_NICE_OLED_WIDGET_PROFILE_TEXT_CUSTOM_X=18
CONFIG_NICE_OLED_WIDGET_PROFILE_TEXT_CUSTOM_Y=18

# Range y 40-80: Layer Indicator (Header, Big Numeral, Name)
CONFIG_NICE_OLED_WIDGET_LAYER=y
CONFIG_NICE_OLED_WIDGET_LAYER_CUSTOM_X=0
CONFIG_NICE_OLED_WIDGET_LAYER_CUSTOM_Y=40

# Range y 95-125: Modifiers indicators (macOS real symbols: Control, Shift, Option, Command)
# 2x2 grid: (X=1, Y=95), 14x14px symbols with 2px gap -> bounds X: 1..30, Y: 95..124
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL_MACOS=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_BOX=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_CUSTOM_X=1
CONFIG_NICE_OLED_WIDGET_MODIFIERS_CUSTOM_Y=95

# --- Peripheral (Right) Screen Configuration ---
# Completely disable peripheral animations (no Bongo Cat, no gem, no spaceman)
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
