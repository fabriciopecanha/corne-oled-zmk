# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Enable Corne OLED Display and Custom Status Screen
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# 32x128 Canvas for vertical OLED on Corne
CONFIG_NICE_OLED_CUSTOM_CANVAS_WIDTH=32
CONFIG_NICE_OLED_CUSTOM_CANVAS_HEIGHT=128

# Display idle settings (blank screen after timeout to save battery)
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Enable ZMK Studio and completely disable locking
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# --- Etapa B1: Minimal Vertical OLED Integration ---
CONFIG_NICE_OLED_WIDGET_STATUS=y

# Explicitly DISABLE all animations, Luna, Bongo Cat, Raw HID
CONFIG_NICE_OLED_WIDGET_WPM=n
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_RESPONSIVE_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_RAW_HID=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n

# Explicitly DISABLE modifier indicators in B1
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_LUNA=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL=n

# Layer and Battery widgets kept disabled in B1 (added in B2)
CONFIG_NICE_OLED_WIDGET_LAYER=n
